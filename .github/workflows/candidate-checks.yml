name: candidate-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-public-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public candidate doctor
        run: python3 tools/sge_public.py doctor
      - name: Test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
