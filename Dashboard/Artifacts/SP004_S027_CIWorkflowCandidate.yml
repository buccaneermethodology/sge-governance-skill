name: candidate-checks

on:
  push:
  pull_request:

jobs:
  deterministic-public-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sge_public.py doctor
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

# 候选工作流，仅供 C2 审查；未绑定 owner/repo/branch，也未提交或启用。
